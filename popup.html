<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 14px; margin: 0; background: #fafafa; }
    h3 { margin: 0 0 10px 0; font-size: 15px; color: #222; }
    label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; }
    input[type="password"] { width: 100%; box-sizing: border-box; margin-bottom: 10px; padding: 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 13px; }
    .checkbox-row { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; font-size: 12px; color: #333; cursor: pointer; }
    button { width: 100%; padding: 10px; background: #1473e6; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 13px; transition: background 0.2s; }
    button:hover { background: #0d66d0; }
    button:disabled { background: #99c2f5; cursor: not-allowed; }
    #status { font-size: 12px; color: #333; margin-top: 10px; line-height: 1.4; background: #fff; padding: 8px; border-radius: 4px; border: 1px solid #e5e5e5; }
  </style>
</head>
<body>
  <h3>My Fast Adobe Stock Tagger</h3>
  <label for="apiKey">API-ключ GroqCloud (gsk_...):</label>
  <input type="password" id="apiKey" placeholder="Вставьте ключ gsk_...">
  
  <label class="checkbox-row">
    <input type="checkbox" id="aiCheck" checked>
    <span>Ставить галочку «Created using generative AI»</span>
  </label>

  <button id="runBtn">Запустить обработку</button>
  <div id="status">Откройте кабинет Adobe Stock, выделите нужные фото (или оставьте все) и нажмите кнопку.</div>
  <script src="popup.js"></script>
</body>
</html>
