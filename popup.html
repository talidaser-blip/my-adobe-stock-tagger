<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; font-family: Arial, sans-serif; padding: 12px; }
    input, button { width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 8px; }
    button { background: #1473e6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #0d66d0; }
    #status { font-size: 13px; color: #333; margin-top: 6px; }
  </style>
</head>
<body>
  <input type="password" id="apiKey" placeholder="Вставьте ключ Groq (gsk_...)">
  <button id="runBtn">Заполнить выбранное фото</button>
  <div id="status">Выберите фото на Adobe Stock и нажмите кнопку.</div>
  <script src="popup.js"></script>
</body>
</html>
